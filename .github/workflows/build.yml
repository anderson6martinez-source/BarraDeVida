
name: Compilar BarraDeVida

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes NuGet
        run: dotnet restore SurvivalcraftTemplateModForAPI.csproj

      - name: Compilar en Release
        run: dotnet build SurvivalcraftTemplateModForAPI.csproj --configuration Release --no-restore

      - name: Subir el SCMod
        uses: actions/upload-artifact@v4
        with:
          name: BarraDeVida-scmod
          path: bin/BarraDeVida.scmod
          if-no-files-found: error
          retention-days: 14
          
